<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Formulaire Inscription</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f8f9fa; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; margin-top: 5px; }
        .success { color: green; margin-top: 5px; }
    </style>
</head>
<body>
    <h2>🧪 Test Formulaire d'Inscription Simplifié</h2>
    <p>Ce formulaire teste directement l'inscription sans JavaScript complexe.</p>
    
    <form action="http://localhost:8000/auth/register" method="POST" enctype="multipart/form-data" id="testForm">
        <div class="form-group">
            <label for="prenom">Prénom *</label>
            <input type="text" id="prenom" name="prenom" value="Test" required>
        </div>
        
        <div class="form-group">
            <label for="nom">Nom *</label>
            <input type="text" id="nom" name="nom" value="User" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" value="test@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="telephone">Téléphone *</label>
            <input type="tel" id="telephone" name="telephone" value="0123456789" required>
        </div>
        
        <div class="form-group">
            <label for="pays">Pays *</label>
            <select id="pays" name="pays" required>
                <option value="">Choisir...</option>
                <option value="France" selected>France</option>
                <option value="Belgique">Belgique</option>
                <option value="Suisse">Suisse</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="ville">Ville *</label>
            <input type="text" id="ville" name="ville" value="Paris" required>
        </div>
        
        <div class="form-group">
            <label for="niveau">Niveau *</label>
            <select id="niveau" name="niveau" required>
                <option value="">Choisir...</option>
                <option value="debutant" selected>Débutant</option>
                <option value="intermediaire">Intermédiaire</option>
                <option value="perfectionnement">Perfectionnement</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="formation">Formation *</label>
            <select id="formation" name="formation" required>
                <option value="">Choisir...</option>
                <option value="design_graphique" selected>Design Graphique</option>
                <option value="community_management">Community Management</option>
                <option value="intelligence_artificielle">Intelligence Artificielle</option>
                <option value="gestion_informatique">Gestion Informatique</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="photo">Photo (optionnel)</label>
            <input type="file" id="photo" name="photo" accept="image/*">
        </div>
        
        <div class="form-group">
            <label for="password">Mot de passe *</label>
            <input type="password" id="password" name="password" value="password123" required>
        </div>
        
        <div class="form-group">
            <label for="password_confirmation">Confirmer le mot de passe *</label>
            <input type="password" id="password_confirmation" name="password_confirmation" value="password123" required>
        </div>
        
        <div class="form-group">
            <label>
                <input type="checkbox" name="terms" value="1" required checked>
                J'accepte les conditions d'utilisation
            </label>
        </div>
        
        <!-- Token CSRF sera ajouté dynamiquement -->
        <input type="hidden" name="_token" id="csrf_token" value="">
        
        <button type="submit">S'inscrire</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        // Récupérer le token CSRF depuis Laravel
        fetch('http://localhost:8000/auth/register')
            .then(response => response.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const csrfToken = doc.querySelector('meta[name="csrf-token"]') || 
                                 doc.querySelector('input[name="_token"]');
                
                if (csrfToken) {
                    const tokenValue = csrfToken.getAttribute('content') || csrfToken.value;
                    document.getElementById('csrf_token').value = tokenValue;
                    console.log('Token CSRF récupéré:', tokenValue);
                } else {
                    console.error('Token CSRF non trouvé');
                    document.getElementById('result').innerHTML = 
                        '<div class="error">❌ Token CSRF non trouvé. Vérifiez que Laravel fonctionne.</div>';
                }
            })
            .catch(error => {
                console.error('Erreur récupération token:', error);
                document.getElementById('result').innerHTML = 
                    '<div class="error">❌ Erreur de connexion au serveur Laravel.</div>';
            });
        
        // Gérer la soumission du formulaire
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const result = document.getElementById('result');
            
            result.innerHTML = '<div>⏳ Inscription en cours...</div>';
            
            fetch('http://localhost:8000/auth/register', {
                method: 'POST',
                body: formData,
                credentials: 'same-origin'
            })
            .then(response => {
                if (response.ok) {
                    if (response.redirected) {
                        result.innerHTML = '<div class="success">✅ Inscription réussie ! Redirection vers: ' + response.url + '</div>';
                        setTimeout(() => window.location.href = response.url, 2000);
                    } else {
                        return response.text();
                    }
                } else {
                    return response.text().then(text => {
                        throw new Error(`HTTP ${response.status}: ${text}`);
                    });
                }
            })
            .then(html => {
                if (html) {
                    // Afficher la réponse HTML pour debug
                    result.innerHTML = '<div class="error">❌ Réponse inattendue:</div><pre>' + 
                                     html.substring(0, 500) + '...</pre>';
                }
            })
            .catch(error => {
                console.error('Erreur inscription:', error);
                result.innerHTML = '<div class="error">❌ Erreur: ' + error.message + '</div>';
            });
        });
    </script>
</body>
</html>
